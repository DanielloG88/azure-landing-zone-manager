parameters:
  - name: allowNetworkDeletion
    type: boolean
    default: false
  - name: hubPipelineId
    type: string
    default: "0"
  - name: environmentName
    type: string
  - name: environmentDisplayName
    type: string
  - name: serviceConnection
    type: string
  - name: additionalPlanCommandOptions
    type: string
    default: ""

jobs:
  - job: ci_infra_${{ parameters.environmentName }}
    displayName: Build ${{ parameters.environmentDisplayName }} Infrastructure
    variables:
      - name: terraformPlanName
        value: terraform.${{ parameters.environmentName }}.tfplan
      - name: terraformWorkingDirectory
        value: $(System.DefaultWorkingDirectory)/infrastructure
    steps:
      - ${{ if ne(parameters.hubPipelineId, '0') }}:
          - task: DownloadPipelineArtifact@2
            displayName: Download latest applied shared hub catalogue
            inputs:
              buildType: specific
              project: $(System.TeamProject)
              definition: ${{ parameters.hubPipelineId }}
              buildVersionToDownload: latestFromBranch
              branchName: refs/heads/main
              tags: HubCatalog
              artifactName: network-hub-catalog
              targetPath: $(Pipeline.Workspace)/network-hub-catalog
          - bash: |
              set -euo pipefail
              cp "$HUB_CATALOG" "$WORKING_DIRECTORY/network-hubs.auto.tfvars.json"
            displayName: Load shared hub contract for this plan
            env:
              HUB_CATALOG: $(Pipeline.Workspace)/network-hub-catalog/network-hubs.auto.tfvars.json
              WORKING_DIRECTORY: $(terraformWorkingDirectory)
      - template: terraform.yml
        parameters:
          serviceConnection: ${{ parameters.serviceConnection }}
          step: plan
          # terraform.yml now loads backend settings from Azure DevOps secure files, so no backend parameters needed.
          environmentName: ${{ parameters.environmentName }}
          planName: $(terraformPlanName)
          workingDirectory: $(terraformWorkingDirectory)
          allowNetworkDeletion: ${{ parameters.allowNetworkDeletion }}
          additionalPlanCommandOptions: ${{ parameters.additionalPlanCommandOptions }}

      - task: DeleteFiles@1
        displayName: Prepare Publishing
        inputs:
          sourceFolder: $(terraformWorkingDirectory)
          contents: |
            .terraform
            **/*.tfvars
            **/*.tfvars.json
            **/*.tfbackend
            ${{ parameters.environmentName }}

      - task: PublishPipelineArtifact@1
        displayName: Publish Terraform
        inputs:
          targetPath: $(terraformWorkingDirectory)
          artifact: infrastructure-${{ parameters.environmentName }}
